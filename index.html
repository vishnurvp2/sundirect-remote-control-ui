<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Control UI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="containerRow">
        <button class="generalButton">MAIL</button>
        <button class="generalButton powerButton">POWER</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">HDD</button>
        <button class="generalButton">TIMER</button>
        <button class="generalButton">EPG</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">1</button>
        <button class="generalButton">2</button>
        <button class="generalButton">3</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">4</button>
        <button class="generalButton">5</button>
        <button class="generalButton">6</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">7</button>
        <button class="generalButton">8</button>
        <button class="generalButton">9</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">TV / RA</button>
        <button class="generalButton">0</button>
        <button class="generalButton">LAST</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">FAV</button>
        <button class="generalButton">INFO</button>
      </div>
      <div class="containerRow">
        <button class="generalButton align-center">UP</button>
      </div>
      <div class="containerRow">
        <button class="generalButton sideArrowButton">LEFT</button>
        <button class="generalButton okRoundButton">OK</button>
        <button class="generalButton sideArrowButton">RIGHT</button>
      </div>
      <div class="containerRow">
        <button class="generalButton downArrowButton align-center">DOWN</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">MENU</button>
        <button class="generalButton">EXIT</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">+</button>
        <button class="generalButton">ALT</button>
        <button class="generalButton">PREV</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">VOL</button>
        <button class="generalButton">AUDIO</button>
        <button class="generalButton">CH</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">-</button>
        <button class="generalButton">MUTE</button>
        <button class="generalButton">NEXT</button>
      </div>
      <div class="containerRow">
        <button class="generalButton">REC</button>
        <button class="generalButton">STOP</button>
      </div>
      <div class="containerRow">
        <button class="generalButton reverseButton playbackButton">REV</button>
        <button class="generalButton playButton playbackButton">PLAY</button>
        <button class="generalButton pauseButton playbackButton">PAUSE</button>
        <button class="generalButton fastForwardButton playbackButton">
          FF
        </button>
      </div>
      <div class="containerRow logoContainer">
        <div class="logoLeftPart">
          <span class="sunBig">SUN</span>
          <span class="smallDirect">DIRECT</span>
        </div>
        <span class="logoRightPart">HD</span>
      </div>
      <div class="containerRow">
        <span class="align-center generalText">24 x 7 HELPLINE</span>
      </div>
      <div class="containerRow">
        <span class="align-center generalText">7601012345</span>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
